spring.application.name=ApiGateway
server.port=8087

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=service1
spring.cloud.gateway.routes[0].uri=lb://MESSAGE-SERVICE-1
spring.cloud.gateway.routes[0].predicates[0]=Path=/service1/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/service1/(?<segment>.*), /${segment}

spring.cloud.gateway.routes[1].id=service2
spring.cloud.gateway.routes[1].uri=lb://MESSAGE-SERVICE-2
spring.cloud.gateway.routes[1].predicates[0]=Path=/service2/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/service2/(?<segment>.*), /${segment}

eureka.instance.home-page-url=http://localhost:8087
eureka.instance.status-page-url=http://localhost:8087

